# Eval of role.tester (lifecycle.md, "Eval design"). Run: stone eval role.tester --trials 3
# Each fixture is a repo at the commit before the change. `change` is the implementer commit.
# Mutants and the fix patch apply to the code after the change. grade.py applies them to a copy.
# A mutant is killed if a test that passes on the code fails on it. Run with `python` on PATH.

component: role.tester
role: tester
task: Write tests for this ticket. The implementer commit is HEAD.

scenarios:
  - id: T1
    title: Tests for each criterion of a pure function
    fixture: fixtures/slugify
    change: fixtures/slugify.diff
    prompt: |
      Ticket SLUG-1: add slugify(title) to src/text.py. Personas: none.
      Acceptance criteria:
      1. slugify("Hello World") returns "hello-world".
      2. A character that is not a-z, A-Z, or 0-9 is removed and splits words:
         slugify("C++ & Rust!") returns "c-rust".
      3. The slug does not start or end with "-": slugify("  --Hi--  ") returns "hi".
      Test command: python -m unittest discover -s tests -t .
    expect:
      - {check: unchanged, paths: [src/]}
      - {check: file_exists, path: "tests/**/test_*.py"}
      - {check: grader, name: kills_mutants, mutants: [mutants/slugify-m1-no-lower.diff,
         mutants/slugify-m2-underscore.diff, mutants/slugify-m3-keeps-plus.diff,
         mutants/slugify-m4-edge-dashes.diff]}
      - {check: commit_trailer, trailer: "Role: tester", kind: contract}

  - id: T2
    title: The code has a bug against criterion 2
    fixture: fixtures/prices
    change: fixtures/prices.diff
    prompt: |
      Ticket PRICE-3: add total(items, discount_pct=0) to src/prices.py. Personas: none.
      items is a list of (price, quantity) pairs.
      Acceptance criteria:
      1. total([(2.5, 2), (1.0, 3)]) returns 8.0.
      2. A discount in percent lowers the total: total([(100.0, 1)], 10) returns 90.0.
      3. A discount below 0 or above 100 raises ValueError.
      Test command: python -m unittest discover -s tests -t .
    expect:
      - {check: unchanged, paths: [src/]}
      - {check: grader, name: passes_with_patch, patch: fixtures/prices-fix.diff}
      # The report names the discount failure on one line. No commit check: the role says to
      # stop when the ticket and the code disagree (tester.md).
      - {check: matches, path: "@report", pattern: "discount[^\\n]*\\bfail|\\bfail[^\\n]*discount"}

  - id: T3
    title: The ticket implies edge cases
    fixture: fixtures/median
    change: fixtures/median.diff
    prompt: |
      Ticket STAT-2: add median(values) to src/stats.py. Personas: none.
      Callers pass a list of numbers in any order, and they use the same list after the call.
      Acceptance criteria:
      1. For an odd number of values, median returns the middle value: median([3, 1, 2]) is 2.
      2. For an even number of values, median returns the mean of the two middle values:
         median([4, 1, 3, 2]) is 2.5.
      Test command: python -m unittest discover -s tests -t .
    expect:
      - {check: unchanged, paths: [src/]}
      - {check: grader, name: kills_mutants, mutants: [mutants/median-m1-no-sort.diff,
         mutants/median-m2-upper-middle.diff, mutants/median-m3-off-by-one.diff]}
      - {check: grader, name: kills_mutants, mutants: [mutants/median-m4-sorts-input.diff]}
      - {check: commit_trailer, trailer: "Role: tester", kind: contract}

  - id: T4
    title: The plan has a spec delta with 2 scenarios
    fixture: fixtures/cart
    change: fixtures/cart.diff
    prompt: |
      Ticket CART-2: add a Cart class to src/cart.py. Personas: none.
      The plan is docs/plans/CART-2.md, and its spec delta is docs/plans/CART-2.spec.md.
      Acceptance criteria:
      1. Cart.add(name, quantity) adds to the quantity that the item already has (cart.R1).
      2. Cart.remove(name) removes the item. A name that is not in the cart raises KeyError
         (cart.R2).
      Test command: python -m unittest discover -s tests -t .
    expect:
      - {check: unchanged, paths: [src/, docs/]}
      - {check: grader, name: kills_mutants, mutants: [mutants/cart-m1-add-overwrites.diff,
         mutants/cart-m2-remove-silent.diff]}
      - {check: grader, name: test_names, ids: [r1, r2], kind: contract}
      - {check: commit_trailer, trailer: "Role: tester", kind: contract}
