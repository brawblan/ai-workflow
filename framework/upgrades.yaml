# The record of each release. `stone upgrade` reads it, and `stone check` validates it.
# Newest first. Rules and the form: framework/versioning.md.
versions:
  - version: 1.5.0
    kind: minor
    released: null
    summary: New optional key protect_instruction_files. With true, K6 and the hook protect the instruction files of the harness in any folder (D87), and check K22 tests their text (D89). New command stone check-dependencies (K23) warns on a new package that the PR body does not name (D90). New optional key framework_commit. G3 installs stone from that commit, and PyYAML from a list of hashes (D92). New command stone check-workflows (K24) warns on an unpinned tool in a changed workflow (D93). Generated YAML and Markdown pass a formatter check with default options, the drift check ignores a change of form only, and the new option stone gate --split-checks gives each command of all_checks its own row (D96).
    config:
      added:
        - {key: protect_instruction_files, default: false, note: "true adds the instruction files of the harness to the protected paths of K6 and the hook (D87)."}
        - {key: instruction_text, default: none, note: "hosts and packages that K22 allows in an instruction file (D89)."}
        - {key: framework_commit, default: none, note: "the commit SHA of the tag v<framework_version>. stone upgrade --apply sets it. G3 installs stone from it (D92)."}
      renamed: []
      removed: []
    files:
      - {path: .cornerstone/checks/protected_paths.py, change: changed, note: "The K6 message names an instruction file change. With protect_instruction_files true, the protected paths hold the instruction files (D87)."}
      - {path: .cornerstone/checks/instruction_text.py, change: added, note: "K22. Only with protect_instruction_files true and a profile with K22 (D89)."}
      - {path: .github/workflows/cornerstone-checks.yml, change: changed, note: "A K22 step, only with protect_instruction_files true (D89)."}
      - {path: .github/workflows/cornerstone-checks.yml, change: changed, note: "A K23 step, as a warning, for each profile with K23 (D90)."}
      - {path: .github/workflows/cornerstone-checks.yml, change: changed, note: "A K24 step, as a warning, for each profile with K24 (D93)."}
      - {path: .github/workflows/cornerstone-checks.yml, change: changed, note: "The Install stone step installs from framework_commit, else from the tag. PyYAML and setuptools come from a list of hashes (D92)."}
      - {path: .cornerstone/hooks/protect-paths.py, change: changed, note: "Only with protect_instruction_files true: the protected paths hold the instruction files, in any case (D87, D88)."}
      - {path: .cornerstone/manifest.yaml, change: changed, note: "Lists are indented under their key, quotes are double, and a long value stays on one line. A formatter accepts it (D96)."}
      - {path: .cornerstone/specialists.md, change: changed, note: "The table columns are aligned, and a blank line follows the first comment (D96)."}
      - {path: .claude/agents/planner.md, change: changed, note: "The requirement ID line of the spec delta step is a list item (D96)."}
      - {path: ".github/workflows/cornerstone-<profile>-<trigger>.yml", change: changed, note: "The trigger workflows quote the cron line and the action inputs with double quotes (D96)."}
    steps:
      - "Optional: set protect_instruction_files to true in .cornerstone/config.yaml. Commit the config change alone, with the trailer Role human."
      - "Then run stone render. Commit the generated files alone, with the trailers Role generator and Actor agent."
      - "stone upgrade --apply sets framework_commit. Check in the config diff that it is the commit of the tag v1.5.0."
  - version: 1.4.0
    kind: minor
    released: 2026-10-28
    summary: Check K20 blocks by default. A repo with specialists now fails G3 on a blocking specialist finding (D80). A Waiver (K6) section passes a bot commit on a protected path (D83). stone render applies a profile override file in .cornerstone/profiles/ (D85). New command stone check-ready (K21) reports a Definition of Ready field that is missing or empty, as a warning (D82). K17 counts a dotted token, such as 1.4.0, as one word (D79).
    config:
      added: []
      renamed: []
      removed: []
    files:
      - {path: .github/workflows/cornerstone-checks.yml, change: changed, note: "The K20 step runs with --mode block, only if the repo config has specialists (D80)."}
      - {path: .github/workflows/cornerstone-checks.yml, change: changed, note: "The K6 step gets the PR body and the PR author through env (D83)."}
      - {path: .cornerstone/checks/protected_paths.py, change: changed, note: "K6 reads a Waiver (K6) section for a bot commit on a PR that a bot opened (D83)."}
    steps:
      - "Run stone render. If the repo config has specialists, G3 now fails on a blocking specialist finding. To pass, fix the finding, or add a Waiver (K20) section with text to the PR body."
      - "If the repo has a file in .cornerstone/profiles/, run stone check first. It now validates the file (D84), and stone render applies it (D85). Fix each finding."
  - version: 1.3.0
    kind: minor
    released: 2026-10-27
    summary: Optional keys under ci. ci.env and ci.secrets add an env block to the All checks step of the G3 workflow. ci.setup adds steps before Install. ci.branches limits K6, K7, K14, and K20 to PRs into the listed base branches, so a promotion PR runs only the other checks.
    config:
      added:
        - {key: ci.env, default: none, note: "A map of NAME: value for the All checks step. Plain values only (D72)."}
        - {key: ci.secrets, default: none, note: "A list of repo secret names. The All checks step gets ${{ secrets.NAME }} (D72)."}
        - {key: ci.setup, default: none, note: "node adds a pinned actions/setup-node step with cache npm. steps adds uses/with/run items before Install (D73)."}
        - {key: ci.branches, default: null, note: "A list of base branches. K6, K7, K14, and K20 run only on a PR into one of them. It must list branches.integration (D74)."}
      renamed: []
      removed: []
    files:
      - {path: .github/workflows/cornerstone-checks.yml, change: changed, note: "The All checks step has an env block, only if ci.env or ci.secrets is set (D72). Setup steps before Install, only if ci.setup is set (D73). The K6, K7, K14, and K20 steps have an if on the base branch, only with ci.branches (D74)."}
    steps:
      - "To pass a secret to the tests, add it as a repo secret, list its name in ci.secrets, and run stone render. A PR from a fork gets an empty value, so the test must skip."
      - "Optional: add ci.setup to .cornerstone/config.yaml, then run stone render."
      - "To skip K6, K7, K14, and K20 on promotion PRs, set ci.branches to the base branches of the ticket PRs, for example [dev]. Run stone render. Commit the generated file alone, with the trailers Role generator and Actor agent."
      - "With ci.branches, turn on a required human review for each base branch that is not in the list (G5)."
  - version: 1.2.1
    kind: patch
    released: 2026-10-23
    summary: stone render keeps the indent (a tab, or N spaces) and the final newline of a JSON file that it merges into, for example .claude/settings.json. Each role file lists the tool StructuredOutput, so a trigger run with --json-schema returns its report and the post job posts it.
    config:
      added: []
      renamed: []
      removed: []
    files:
      - {path: .claude/settings.json, change: changed, note: "Render no longer changes the indent of the file (D70)."}
      - {path: .claude/agents/implementer.md, change: changed, note: "The tools list has StructuredOutput (D71)."}
      - {path: .claude/agents/tester.md, change: changed, note: "The tools list has StructuredOutput (D71)."}
      - {path: .claude/agents/reviewer.md, change: changed, note: "The tools list has StructuredOutput (D71)."}
      - {path: .claude/agents/shaper.md, change: changed, note: "The tools list has StructuredOutput (D71)."}
      - {path: .claude/agents/planner.md, change: changed, note: "The tools list has StructuredOutput (D71)."}
      - {path: .claude/agents/investigator.md, change: changed, note: "The tools list has StructuredOutput (D71)."}
    steps:
      - "Run stone render. If a formatter changed the indent of .claude/settings.json, render now keeps it."
      - "Run stone render. Commit the changed generated files alone, with the trailers Role generator and Actor agent."
  - version: 1.2.0
    kind: minor
    released: 2026-10-22
    summary: The claude-5 profile uses Sonnet for the implementer and the tester, and sets an effort for each role. The role files tell the role to run the checks once, to stop after 2 failed fixes, and to do one ticket in a session. Check K20 fails a PR with a blocking specialist finding. paths.plans and paths.reports accept {id}, for one folder for each ticket.
    config:
      added:
        - {key: paths.plans, default: docs/plans/, note: "Accepts {id} as the last folder level: one folder for each ticket (D67)."}
        - {key: paths.reports, default: docs/reports/, note: "Accepts {id} as the last folder level, as paths.plans does (D67)."}
      renamed: []
      removed: []
    files:
      - {path: .claude/agents/implementer.md, change: changed, note: "Model is Sonnet, with effort medium. Has the check run rule, the stop rule, and the session rule (D63)."}
      - {path: .claude/agents/tester.md, change: changed, note: "Model is Sonnet, with effort medium. Has the check run rule and the session rule (D63)."}
      - {path: .claude/agents/reviewer.md, change: changed, note: "Has effort high and the session rule (D63)."}
      - {path: .claude/agents/shaper.md, change: changed, note: "Has effort medium and the session rule (D63)."}
      - {path: .github/workflows/cornerstone-checks.yml, change: changed, note: "Has a K20 step, only with a specialists section (D66)."}
    steps:
      - "Run stone render. Commit the changed generated files alone, with the trailers Role generator and Actor agent."
      - "With a specialists section: add the lines Ticket and Personas to each PR body, and commit each findings report in the PR (D66)."
      - "To keep a role on a stronger model, set it in the model profile of the repo. Render again."
      - "Check the when.paths values of each specialist. They use the rules of paths.tests (D65). A value that starts with ./ no longer matches."
      - "To give each ticket its own folder, set paths.plans or paths.reports to a value that ends with {id}/, for example .stone/plans/{id}/. Move the old files into ticket folders. Run stone render (D67)."
  - version: 1.1.0
    kind: minor
    released: 2026-10-22
    summary: Optional settings for a local-only setup, role commits, opt-in adoption, specialist reviews, and ticket files. New commands stone gate, stone specialists, and stone upgrade.
    config:
      added:
        - {key: delivery, default: ci, note: "ci, or local: no workflow file (D56)."}
        - {key: adoption, default: all, note: "all, or opt-in: only marked PRs get the G3 checks (D58)."}
        - {key: commits.by, default: agent, note: "agent, or human: the role gives a commit message (D57)."}
        - {key: commits.trailers, default: commit, note: "commit, notes, or none. none does not render K6 (D57)."}
        - {key: commits.message_format, default: null, note: "A file in the repo, or a URL, that the roles follow (D57)."}
        - {key: specialists, default: null, note: "A list of specialist reviews (D59)."}
        - {key: tickets.source, default: github, note: "github, or file (D60)."}
        - {key: tickets.path, default: null, note: "With source file: a path with {id} once (D60)."}
      renamed: []
      removed: []
    files:
      - {path: .cornerstone/checks/protected_paths.py, change: changed, note: "K6 reads a role from a git note, and skips a human commit in opt-in mode (D57, D58)."}
      - {path: .cornerstone/hooks/protect-paths.py, change: changed, note: "The hook has a rule for the shaper (D60)."}
      - {path: .cornerstone/specialists.md, change: added, note: "Only with a specialists section (D59)."}
    steps:
      - "Install the new stone, and set framework_version to 1.1.0."
      - "Run stone render. Commit the changed generated files alone, with the trailers Role generator and Actor agent."
      - "The link check of stone check tests fewer files by default (D54). Set checks.links.paths, or run stone check --links all, to keep the old scope."
      - "A session that has no role name now gets the implementer rules, also when STONE_ROLE is empty (D55)."
  - version: 1.0.0
    kind: major
    released: 2026-10-21
    summary: The first release. All 10 profiles, the stone CLI, and the first adapter.
    config:
      added: []
      renamed: []
      removed: []
    files: []
    steps: []
