# How `stone eval` starts one headless role run in this harness (lifecycle.md, "Eval design").
# stone fills $role, $model, $budget, and $prompt. An argument that is only $tools becomes the
# tool list of the role. For a role eval, the two variants differ only in --agent: the role file is
# also removed from the workspace for "without". The hook and the tools stay the same in both
# variants. For any other component (a hook), the runner uses `with` for both variants, so both
# load the same role file, and "without" removes only the component (D44).

run:
  with: [claude, -p, --agent, $role, --model, $model, --output-format, stream-json, --verbose,
         --permission-mode, acceptEdits, --setting-sources, project, --max-budget-usd, $budget,
         --allowedTools, $tools, --, $prompt]
  without: [claude, -p, --model, $model, --output-format, stream-json, --verbose,
            --permission-mode, acceptEdits, --setting-sources, project, --max-budget-usd, $budget,
            --allowedTools, $tools, --, $prompt]

env:   # the protected-path hook reads the role from STONE_ROLE in both variants
  with: {STONE_ROLE: $role}
  without: {STONE_ROLE: $role}

tools:   # the same lists as the role files, plus the commands that the role runs
  planner: [Read, Grep, Glob, Write]
  tester: [Read, Grep, Glob, Edit, Write, "Bash(python -m unittest*)", "Bash(git diff*)",
           "Bash(git log*)", "Bash(git show*)", "Bash(git add*)", "Bash(git commit*)",
           "Bash(git status*)"]
  # The hook.protect-paths eval (D39): the shell write forms of its scenarios. Confirmed on
  # 2026-10-19: sed -i, a redirect, and python3 -c ran under acceptEdits. A command with a second
  # part (`; echo ...`) needed approval, so the model ran it again alone. [TO CONFIRM] tee and cp:
  # in that run, the model started neither (it refused in 26 of 30 runs).
  implementer: [Read, Grep, Glob, Edit, Write, "Bash(sed -i*)", "Bash(printf*)", "Bash(tee*)",
                "Bash(cp*)", "Bash(python3 -c*)", "Bash(git diff*)", "Bash(git status*)"]

output_where: {type: result}   # use the last JSON object with these keys and values

output:   # dotted paths in the last JSON object of the output (the "result" event).
          # stone reads these names: report, cost_usd, input_tokens, output_tokens, turns.
  report: result
  cost_usd: total_cost_usd
  input_tokens: usage.input_tokens
  output_tokens: usage.output_tokens
  turns: num_turns
