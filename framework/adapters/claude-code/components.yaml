# Components that `stone render` writes for this harness: one template and one target path each.
# A role is rendered only if a selected profile uses it. eval: the planned eval folder (lifecycle.md).

components:
  - id: role.shaper
    kind: role
    role: shaper
    purpose: Interview the human until the ticket meets the Definition of Ready.
    principle: [P3]
    template: agents/shaper.md
    target: .claude/agents/shaper.md
    eval: evals/role-shaper/

  - id: role.planner
    kind: role
    role: planner
    purpose: Write the plan artifact and the progress file. A human approves them at G2.
    principle: [P3, P7]
    template: agents/planner.md
    target: .claude/agents/planner.md
    eval: evals/role-planner/

  - id: role.implementer
    kind: role
    role: implementer
    purpose: Change the code to meet the ticket. Write the decision log.
    principle: [P2, P8]
    template: agents/implementer.md
    target: .claude/agents/implementer.md
    eval: evals/role-implementer/

  - id: role.tester
    kind: role
    role: tester
    purpose: Write independent tests from the ticket and the diff.
    principle: [P2]
    template: agents/tester.md
    target: .claude/agents/tester.md
    eval: evals/role-tester/

  - id: role.reviewer
    kind: role
    role: reviewer
    purpose: Find defects and scope drift in a fresh session.
    principle: [P2, P11]
    template: agents/reviewer.md
    target: .claude/agents/reviewer.md
    eval: evals/role-reviewer/

  - id: hook.protect-paths
    kind: hook
    purpose: Block an edit to a path that the current role must not change.
    principle: [P2, P6]
    template: hooks/protect-paths.py
    target: .cornerstone/hooks/protect-paths.py
    eval: evals/hook-protect-paths/

  - id: hook.settings
    kind: hook
    purpose: Register the protected-path hook in the harness settings. Other keys stay as they are.
    principle: [P6]
    template: hooks/settings.json
    target: .claude/settings.json
    merge: json
    eval: evals/hook-protect-paths/

  - id: check.k6
    kind: check
    purpose: K6. Fail if an implementer commit changes a protected path.
    principle: [P2, P6]
    template: checks/protected_paths.py
    target: .cornerstone/checks/protected_paths.py
    eval: ""

  - id: ci-job.checks
    kind: ci-job
    purpose: G3. Run K6 and the repo checks on each pull request.
    principle: [P1, P6]
    template: workflows/cornerstone-checks.yml
    target: .github/workflows/cornerstone-checks.yml
    eval: evals/ci-job-checks/
