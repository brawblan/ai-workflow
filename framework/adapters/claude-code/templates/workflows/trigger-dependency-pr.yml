# Generated by stone render. Do not edit: change .cornerstone/config.yaml and render again.
# Trigger $trigger for the $profile profile. A dependency bot opens a PR, and the $role reads it.
# A Dependabot run gets only Dependabot secrets. Add the harness secret there too.
name: cornerstone-$profile-dependency-pr

on:
  pull_request:
    types: [opened, reopened]

permissions: {}

concurrency:
  group: cornerstone-$profile-$${{ github.event.pull_request.number }}

jobs:
  run:
    if: contains(fromJSON('["dependabot[bot]", "renovate[bot]"]'), github.event.pull_request.user.login)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      report: $${{ steps.run.outputs.structured_output && fromJSON(steps.run.outputs.structured_output).report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Save the PR
        env:
          GH_TOKEN: $${{ github.token }}
          PR_NUMBER: $${{ github.event.pull_request.number }}
        run: |
          mkdir -p "$${RUNNER_TEMP}/cornerstone"
          gh pr view "$${PR_NUMBER}" --repo "$${GITHUB_REPOSITORY}" \
            --json number,title,body,files,headRefName > "$${RUNNER_TEMP}/cornerstone/event.json"

      $run_role

  post:
    needs: run
    if: needs.run.outputs.report != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      $frame_report

      - name: Post the report on the PR
        env:
          GH_TOKEN: $${{ github.token }}
          PR_NUMBER: $${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$${PR_NUMBER}" --repo "$${GITHUB_REPOSITORY}" \
            --body-file "$${RUNNER_TEMP}/cornerstone-report.md"
