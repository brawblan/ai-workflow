# Generated by stone render. Do not edit: change .cornerstone/config.yaml and render again.
# Trigger $trigger for the $profile profile. Each new issue starts the $role. Anyone can open an
# issue, so the run job reads untrusted text with no write token (D31).
name: cornerstone-$profile-issue-opened

on:
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: cornerstone-$profile-$${{ github.event.issue.number }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
    outputs:
      report: $${{ steps.run.outputs.structured_output && fromJSON(steps.run.outputs.structured_output).report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Save the issue
        env:
          GH_TOKEN: $${{ github.token }}
          ISSUE_NUMBER: $${{ github.event.issue.number }}
        run: |
          mkdir -p "$${RUNNER_TEMP}/cornerstone"
          gh issue view "$${ISSUE_NUMBER}" --repo "$${GITHUB_REPOSITORY}" \
            --json number,title,body,labels,comments > "$${RUNNER_TEMP}/cornerstone/event.json"

      $run_role

  post:
    needs: run
    if: needs.run.outputs.report != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      $frame_report

      - name: Post the report on the issue
        env:
          GH_TOKEN: $${{ github.token }}
          ISSUE_NUMBER: $${{ github.event.issue.number }}
        run: |
          gh issue comment "$${ISSUE_NUMBER}" --repo "$${GITHUB_REPOSITORY}" \
            --body-file "$${RUNNER_TEMP}/cornerstone-report.md"
