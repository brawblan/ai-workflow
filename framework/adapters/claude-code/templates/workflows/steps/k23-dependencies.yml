      # K23 warns in 1.x (D90). A new package in a manifest needs a "Dependencies" section that names it.
      - name: $step_name
$gate_if
        env:
          BASE_REF: $${{ github.base_ref }}
          PR_BODY: $${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$${PR_BODY}" | "$${RUNNER_TEMP}/stone/bin/stone" check-dependencies - \
            --base "origin/$${BASE_REF}" --mode warn --format github
