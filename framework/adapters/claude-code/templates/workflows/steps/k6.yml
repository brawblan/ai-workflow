      - name: K6 protected paths
$gate_if
        env:
          BASE_REF: $${{ github.base_ref }}
          PR_AUTHOR: $${{ github.event.pull_request.user.login }}
          PR_BODY: $${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$${PR_BODY}" | python3 .cornerstone/checks/protected_paths.py \
            "origin/$${BASE_REF}" --body - --pr-author "$${PR_AUTHOR}"
