      # K10: the repo command tests the mutants in the code changed since BASE_REF. It fails if the
      # mutation score is under MUTATION_SCORE_MIN (limits.mutation_score_changed_code).
      # A failing command fails the job, and G3 blocks (D52).
      - name: $step_name
$marker_if
        env:
          BASE_REF: origin/$${{ github.base_ref }}
          MUTATION_SCORE_MIN: $limit_mutation_score_changed_code
        run: $step_command
