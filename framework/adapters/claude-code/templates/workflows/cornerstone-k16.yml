# Generated by stone render. Do not edit: change .cornerstone/config.yaml and render again.
# K16: fail a pull request from a spike/ branch into the main branch. Spike code never merges.
# Make this job a required status check on the main branch.
#
# pull_request_target runs this file from the base branch, so a spike branch cannot change or
# remove it. That is safe here: the job checks out no code, has no permissions, and gets the
# branch names only through env.
name: cornerstone-k16

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize] # edited: the PR changed its base branch

permissions: {}

jobs:
  k16:
    runs-on: ubuntu-latest
    steps:
      # K16 blocks from the start (D30). The investigator hook trusts the spike/ prefix (D25).
      - name: K16 no merge to main
        env:
          HEAD_REF: $${{ github.head_ref }}
          BASE_REF: $${{ github.base_ref }}
          MAIN_BRANCH: $branch_main_json
        run: |
          case "$${HEAD_REF}" in
            spike/*)
              if [ "$${BASE_REF}" = "$${MAIN_BRANCH}" ]; then
                echo "::error title=K16 no merge to main::The branch $${HEAD_REF} is a spike branch. Spike code must not merge into $${MAIN_BRANCH}. Close this PR. To keep the code, rebuild it on a new branch with a profile that has gate G3."
                exit 1
              fi
              ;;
          esac
          echo "K16: pass. This PR is not from a spike branch into $${MAIN_BRANCH}."
