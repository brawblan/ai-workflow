# Generated by stone render. Do not edit: change .cornerstone/config.yaml and render again.
# Trigger label:$trigger_label for the $profile profile. A human adds the label to a ready issue.
# The job runs only if the issue also has the label $select_label. That label is profile:<id> when
# more than one selected profile uses label:$trigger_label. Then add it before the trigger label.
name: cornerstone-$profile-label

on:
  issues:
    types: [labeled]

permissions: {}

concurrency:
  group: cornerstone-$profile-$${{ github.event.issue.number }}

jobs:
  run:
    if: >-
      github.event.label.name == '$trigger_label'
      && contains(github.event.issue.labels.*.name, '$select_label')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      report: $${{ steps.run.outputs.structured_output && fromJSON(steps.run.outputs.structured_output).report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Save the issue
        env:
          GH_TOKEN: $${{ github.token }}
          ISSUE_NUMBER: $${{ github.event.issue.number }}
        run: |
          mkdir -p "$${RUNNER_TEMP}/cornerstone"
          gh issue view "$${ISSUE_NUMBER}" --repo "$${GITHUB_REPOSITORY}" \
            --json number,title,body,labels,comments > "$${RUNNER_TEMP}/cornerstone/event.json"

      $run_role

  post:
    needs: run
    if: needs.run.outputs.report != ''
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Post the report on the issue
        env:
          GH_TOKEN: $${{ github.token }}
          ISSUE_NUMBER: $${{ github.event.issue.number }}
          REPORT: $${{ needs.run.outputs.report }}
        run: |
          printf '%s\n' "$${REPORT}" \
            | gh issue comment "$${ISSUE_NUMBER}" --repo "$${GITHUB_REPOSITORY}" --body-file -
