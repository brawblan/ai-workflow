# Generated by stone render. Do not edit: change .cornerstone/config.yaml and render again.
# Trigger $trigger for the $profile profile. A person with write access can also start it by hand.
# $peak_notice
name: cornerstone-$profile-schedule

on:
  schedule:
    - cron: "$cron"
  workflow_dispatch:

permissions: {}

concurrency:
  group: cornerstone-$profile-schedule

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
    outputs:
      report: $${{ steps.report.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Save the open issues
        env:
          GH_TOKEN: $${{ github.token }}
        run: |
          mkdir -p .cornerstone-event
          gh issue list --repo "$${GITHUB_REPOSITORY}" --state open --limit 100 \
            --json number,title,body,labels,createdAt > .cornerstone-event/event.json

      $install_opencode

      $run_role

  post:
    needs: run
    if: needs.run.outputs.report != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      $frame_report

      - name: Post the report as an issue
        env:
          GH_TOKEN: $${{ github.token }}
        run: |
          gh issue create --repo "$${GITHUB_REPOSITORY}" \
            --title "Cornerstone $profile report $$(date -u +%F)" \
            --body-file "$${RUNNER_TEMP}/cornerstone-report.md"
