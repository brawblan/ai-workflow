# Generated by stone render. Do not edit: change .cornerstone/config.yaml and render again.
# Gate G3: K6, K7, K14, and the checks for the profile. Make this job a required status check.
name: cornerstone-checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # K6 reads each commit since the base branch

      - name: K6 protected paths
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "${PR_BODY}" | python3 .cornerstone/checks/protected_paths.py \
            "origin/${BASE_REF}" --body - --pr-author "${PR_AUTHOR}"

      # K7 blocks (D45). A "Waiver (P10)" section in the PR body passes.
      # The limit comes from the "Profile: <id>" line in the PR body.
      - name: K7 change size
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "${PR_BODY}" | python3 .cornerstone/checks/change_size.py \
            "origin/${BASE_REF}" --body - --mode block --format github

      # stone comes from framework_commit, else from the tag in framework_version (D92). A venv keeps
      # it apart from the repo. The hashes pin PyYAML and the build tool. pip gets no other package.
      - name: Install stone
        env:
          STONE_REF: v0.8.0
        run: |
          python3 -m venv "${RUNNER_TEMP}/stone"
          cat > "${RUNNER_TEMP}/stone-requirements.txt" <<'EOF'
          PyYAML==6.0.3 \
            --hash=sha256:10892704fc220243f5305762e276552a0395f7beb4dbf9b14ec8fd43b57f126c \
            --hash=sha256:b8bb0864c5a28024fac8a632c443c87c5aa6f215c0b126c449ae1a150412f31d \
            --hash=sha256:9149cad251584d5fb4981be1ecde53a1ca46c891a79788c0df828d2f166bda28 \
            --hash=sha256:ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc \
            --hash=sha256:ee2922902c45ae8ccada2c5b501ab86c36525b883eff4255313a253a3160861c \
            --hash=sha256:0f29edc409a6392443abf94b9cf89ce99889a1dd5376d94316ae5145dfedd5d6 \
            --hash=sha256:501a031947e3a9025ed4405a168e6ef5ae3126c59f90ce0cd6f2bfc477be31b7 \
            --hash=sha256:c458b6d084f9b935061bc36216e8a69a7e293a2f1e68bf956dcd9e6cbcd143f5
          setuptools==84.2.1 \
            --hash=sha256:ca140b45d5325a9478f880e351484f62fef15f336462e449ca0c03c873d589c2
          EOF
          "${RUNNER_TEMP}/stone/bin/pip" install --quiet --require-hashes --only-binary :all: \
            -r "${RUNNER_TEMP}/stone-requirements.txt"
          "${RUNNER_TEMP}/stone/bin/pip" install --quiet --no-deps --no-build-isolation \
            "cornerstone-stone @ git+https://github.com/brawblan/ai-workflow@${STONE_REF}#subdirectory=stone"

      # K14 blocks (D45, D49). The PR body needs the Evidence, Decision log, Review findings, and Confidence sections.
      - name: K14 PR evidence
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "${PR_BODY}" \
            | "${RUNNER_TEMP}/stone/bin/stone" check-evidence - --mode block --format github

      # K15 blocks since D52. It fails the job if the instruction file is over the line limit.
      - name: K15 instruction size
        run: python3 .cornerstone/checks/instruction_size.py --mode block --format github

      - name: Install
        run: pip install .

      - name: All checks
        run: make check
