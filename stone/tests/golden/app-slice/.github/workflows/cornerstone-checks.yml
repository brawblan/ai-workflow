# Generated by stone render. Do not edit: change .cornerstone/config.yaml and render again.
# Gate G3: K6, K7, K14, and the checks for the profile. Make this job a required status check.
name: cornerstone-checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # K6 reads each commit since the base branch

      - name: K6 protected paths
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 .cornerstone/checks/protected_paths.py "origin/${BASE_REF}"

      # K7 warns for 2 weeks after this step is first rendered. Then the framework changes it to block.
      # The limit comes from the "Profile: <id>" line in the PR body. A "Waiver (P10)" section passes.
      - name: K7 change size
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "${PR_BODY}" | python3 .cornerstone/checks/change_size.py \
            "origin/${BASE_REF}" --body - --mode warn --format github

      # stone comes from the framework tag in framework_version. A venv keeps it apart from the repo.
      - name: Install stone
        env:
          STONE_TAG: v0.8.0
        run: |
          python3 -m venv "${RUNNER_TEMP}/stone"
          "${RUNNER_TEMP}/stone/bin/pip" install --quiet \
            "cornerstone-stone @ git+https://github.com/brawblan/ai-workflow@${STONE_TAG}#subdirectory=stone"

      # K14 warns for 2 weeks after this step is first rendered. Then the framework changes it to block.
      - name: K14 PR evidence
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "${PR_BODY}" \
            | "${RUNNER_TEMP}/stone/bin/stone" check-evidence - --mode warn --format github

      - name: Install
        run: pip install .

      - name: All checks
        run: make check

      # K4 integration tests: a repo command from .cornerstone/config.yaml. Its exit code passes or fails the step.
      # The step warns for 2 weeks after the framework adds it. Then the framework makes it block.
      - name: K4 integration tests
        continue-on-error: true
        run: python -m unittest discover -s tests/integration

      # K5 acceptance tests: a repo command from .cornerstone/config.yaml. Its exit code passes or fails the step.
      # The step warns for 2 weeks after the framework adds it. Then the framework makes it block.
      - name: K5 acceptance tests
        continue-on-error: true
        run: python -m unittest discover -s tests/acceptance

      # K8 architecture fitness: a repo command from .cornerstone/config.yaml. Its exit code passes or fails the step.
      # The step warns for 2 weeks after the framework adds it. Then the framework makes it block.
      - name: K8 architecture fitness
        continue-on-error: true
        run: lint-imports

      # K10: the repo command tests the mutants in the code changed since BASE_REF. It fails if the
      # mutation score is under MUTATION_SCORE_MIN (limits.mutation_score_changed_code).
      # The step warns for 2 weeks after the framework adds it. Then the framework makes it block.
      - name: K10 mutation score
        continue-on-error: true
        env:
          BASE_REF: origin/${{ github.base_ref }}
          MUTATION_SCORE_MIN: 0.6
        run: scripts/mutation-score.sh
