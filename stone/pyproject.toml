[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cornerstone-stone"
version = "0.4.0"
description = "The Cornerstone CLI: validate the framework and run framework checks."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0"]

[project.scripts]
stone = "stone.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
