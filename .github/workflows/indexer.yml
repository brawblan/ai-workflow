# Rust checks on the indexer crate in indexer/ (D104).
name: indexer

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  indexer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: indexer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Each Rust test goes in indexer/tests/, so the hook and K6 protect it (paths.tests).
      # A grep error (exit 2) fails the step too. A line with not(test) passes.
      - name: No tests in indexer/src/
        run: |
          status=0
          matches=$(grep -rnE '#!?\[(([a-z_]+::)*test([](]|$)|cfg(_attr)?\((.*[(, ])?test[,) ])' src) || status=$?
          if [ "$status" -gt 1 ]; then
            echo "::error::grep failed with exit $status."
            exit 1
          fi
          matches=$(printf '%s\n' "$matches" | grep -v 'not(test)' || true)
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo "::error::Move each Rust test to indexer/tests/ (D104)."
            exit 1
          fi

      # rust-toolchain.toml pins the version and the components (P9).
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked
