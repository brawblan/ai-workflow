# Generated by stone render. Do not edit: change .cornerstone/config.yaml and render again.
# Gate G3: K6, K7, K14, and the checks for the profile. Make this job a required status check.
name: cornerstone-checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # K6 reads each commit since the base branch

      - name: K6 protected paths
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 .cornerstone/checks/protected_paths.py "origin/${BASE_REF}"

      # K7 blocks (D45). A "Waiver (P10)" section in the PR body passes.
      # The limit comes from the "Profile: <id>" line in the PR body.
      - name: K7 change size
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "${PR_BODY}" | python3 .cornerstone/checks/change_size.py \
            "origin/${BASE_REF}" --body - --mode block --format github

      # stone comes from the framework tag in framework_version. A venv keeps it apart from the repo.
      - name: Install stone
        env:
          STONE_TAG: v1.0.0
        run: |
          python3 -m venv "${RUNNER_TEMP}/stone"
          "${RUNNER_TEMP}/stone/bin/pip" install --quiet \
            "cornerstone-stone @ git+https://github.com/brawblan/ai-workflow@${STONE_TAG}#subdirectory=stone"

      # K14 blocks (D45, D49). The PR body needs the Evidence, Decision log, Review findings, and Confidence sections.
      - name: K14 PR evidence
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "${PR_BODY}" \
            | "${RUNNER_TEMP}/stone/bin/stone" check-evidence - --mode block --format github

      - name: Install
        run: pip install ./stone

      - name: All checks
        run: python -m unittest discover -s stone/tests && stone check && stone check-writing --diff origin/main
