# Cornerstone checks on this repo: unit tests, stone check, and K17 (writing standard).
name: stone

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  stone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # K17 needs the base branch to find the changed lines

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install stone
        run: pip install ./stone

      - name: Unit tests
        run: python stone/tests/run_parallel.py

      # D96: the render output passes Prettier with its default options. The runner has Node.
      - name: Prettier on the render output
        run: bash stone/tests/format/check_render_format.sh

      - name: stone check
        run: stone check --format github

      # R1 to R4 and K9 block (D78, D97, D98, D100). R2, R4, and K9 need the base branch, so they
      # run on a PR only. K9 does not run on a release PR into main (D103).
      - name: R1 action pins and R3 event text
        if: github.event_name != 'pull_request'
        run: stone check-rules --format github

      - name: R1 to R4 repo rules
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          skip=()
          if [ "$BASE_REF" = "main" ]; then skip=(--skip-k9); fi
          stone check-rules --base "origin/${BASE_REF}" "${skip[@]}" --format github

      # K17 blocks (D45, framework/writing.md).
      - name: K17 on changed lines
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: stone check-writing --diff "origin/${BASE_REF}" --mode block --format github

      - name: K17 on the PR body
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          stone check-writing "$RUNNER_TEMP/pr-body.md" --mode block --format github
