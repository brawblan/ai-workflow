# Cornerstone checks on this repo: unit tests, stone check, and K17 (writing standard).
name: stone

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  stone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # K17 needs the base branch to find the changed lines

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install stone
        run: pip install ./stone

      - name: Unit tests
        run: python -m unittest discover -s stone/tests

      - name: stone check
        run: stone check --format github

      # K17 warns for 2 weeks after this workflow merges, then blocks (framework/writing.md).
      # To block, change --mode warn to --mode block in both K17 steps.
      - name: K17 on changed lines
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: stone check-writing --diff "origin/${BASE_REF}" --mode warn --format github

      - name: K17 on the PR body
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          stone check-writing "$RUNNER_TEMP/pr-body.md" --mode warn --format github
