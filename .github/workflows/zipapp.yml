# Build stone.pyz from the tag commit of a published release, and attach it with its checksum.
# The build job cannot write. Only the upload job gets contents: write, and it runs no repo code.
name: zipapp

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # On a release event, the checkout is the commit of the release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # A fixed PyYAML version, so that a rebuild of the same tag gives the same bytes.
      - name: Install stone
        run: pip install ./stone "PyYAML==6.0.3"

      - name: Build and test the zipapp
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python stone/build_zipapp.py --out dist/stone.pyz
          test "$(python dist/stone.pyz --version)" = "stone ${TAG#v}"
          python dist/stone.pyz check --format github
          (cd dist && sha256sum stone.pyz > stone.pyz.sha256)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zipapp
          path: dist/
          if-no-files-found: error

  upload:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zipapp
          path: dist

      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/stone.pyz dist/stone.pyz.sha256 --clobber --repo "$GITHUB_REPOSITORY"
