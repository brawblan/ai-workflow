schema: spec-driven

# The constitution's principles live in `context` below. The rest of the constitution is in
# constitution/ (mission, tech stack, roadmap). The `rules` tell the agent which file to read for
# each artifact, so it reads a file only when that artifact needs it.
#
# OpenSpec injects `context` into every artifact, and `rules.<artifact>` into that artifact only.
# Above 50KB, OpenSpec ignores the whole context. Keep it short.
# Quote any rule that contains " #". Otherwise YAML reads the rest as a comment.
#
# Amend by PR. Bump the version in the context heading:
#   MAJOR: remove or redefine a principle.
#   MINOR: add a principle or expand guidance.
#   PATCH: wording, links, typos.

context: |
  # Constitution v1.0.0

  Product: <one line from constitution/mission.md: what it is, and for whom>.
  Stack: <one line from constitution/tech-stack.md>. The default branch is <branch>.
  Mission and scope: constitution/mission.md. Stack and limits: constitution/tech-stack.md.
  Order of work: constitution/roadmap.md. Read them when a rule below says so.

  ## Principles (MUST)

  1. <name>. <rule>
  2. Tests. Each change adds unit tests for the code it touches.
  3. Gates. Before merge, <lint, typecheck, tests> pass.

  ## Working style

  - Make the smallest change that solves the problem.
  - Read the current code and tests before you write a design.
  - Put follow-up work in a GitHub issue, not in a code comment.

  ## Changes

  - Change ID: <rule, for example issue-<n>-<slug>>.
  - Keep artifacts short. Write only what a reviewer needs to make a decision.

rules:
  proposal:
    - 'Start with "Issue: #<n>".'
    - Read constitution/mission.md. Check that the change is in scope and is not a non-goal.
    - Read constitution/roadmap.md. Name the roadmap phase that this change serves, or say "none" and give the reason.
    - Include a "Non-goals" list.
  specs:
    - Use SHALL or MUST in each requirement. Write each scenario with WHEN and THEN.
    - Reuse an existing capability in openspec/specs/ before you add a new one.
  design:
    - Read constitution/tech-stack.md. Use only approved technology. If the change adds a dependency or a service, update tech-stack.md in the same change.
    - Read the current code and tests first. Cite the file paths that you read.
    - End with "Constitution check". List only the principles that this change touches, one line each.
  tasks:
    - Pair each code task with a unit-test task for the same code.
    - The last group holds doc updates.
